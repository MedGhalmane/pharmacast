<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharmacast</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --fg: #1a1d23;
      --accent: #2f6feb;
      --muted: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --fg: #e8eaed;
        --accent: #6ea8fe;
        --muted: #9aa1ac;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 480px; }
    h1 {
      font-size: 2.2rem;
      margin: 0 0 12px;
    }
    p {
      color: var(--muted);
      line-height: 1.5;
      margin: 0;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Pharmacast</h1>
    <p>This site is up and running. More to come soon.</p>
    <span class="badge">Live on GitHub Pages</span>
  </main>
</body>
</html>
